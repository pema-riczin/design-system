name: 'Send Slack Notifications'
description: 'sends build notification to slack channels using incoming webhooks'

inputs:
  slack-webhook-url:
    description: 'Webhook URL for the slack app'
    required: true
  slack-title:
    description: 'Slack Notification title'
    required: true
  slack-body:
    description: 'Slack Notification message body'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Send Slack Notifications
      id: send-slack-notification
      env:
        SLACK_TITLE: ${{ inputs.slack-title }}
        SLACK_BODY: ${{ inputs.slack-body }}
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
      run: |
        echo "Slack notification sent to #broadcast-design-system-releases"
        curl -X POST -H 'Content-type: application/json' \
          --data '{
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "'"$SLACK_TITLE"'"
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "'"$SLACK_BODY"'"
                }
              }
            ]}' "$SLACK_WEBHOOK_URL"
      shell: bash
